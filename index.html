<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mist of Ruins 〜霧の遺跡〜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1218; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas.webgl { display: block; }

  /* ---- cinematic vignette ---- */
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(8,14,22,0.45) 100%); }
  #hurt { position: fixed; inset: 0; pointer-events: none; z-index: 6; opacity: 0; transition: opacity .25s;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(180,20,20,0.45) 100%); }

  /* ---- minimap (top-left) ---- */
  #minimapWrap { position: fixed; top: 22px; left: 22px; width: 170px; height: 170px; z-index: 10; }
  #minimap { width: 170px; height: 170px; border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(120,220,230,0.35), 0 0 18px rgba(60,180,200,0.35), inset 0 0 24px rgba(0,20,30,0.6); }
  #minimapGem { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px;
    background: radial-gradient(circle at 40% 35%, #d8fffb, #3ee6d8 55%, #0a6f78); border-radius: 50%;
    box-shadow: 0 0 10px #4be8de; }
  #questIcons { position: fixed; top: 200px; left: 30px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
  .qicon { width: 34px; height: 26px; border-radius: 6px; background: rgba(10,25,32,0.55);
    border: 1px solid rgba(130,220,230,0.35); color: #cdeef2; font-size: 13px;
    display: flex; align-items: center; justify-content: center; }

  /* ---- rune compass (bottom-left) ---- */
  #compass { position: fixed; left: 22px; bottom: 70px; width: 150px; height: 150px; z-index: 10; opacity: 0.95; }

  /* ---- small utility buttons next to compass ---- */
  #utilBtns { position: fixed; left: 185px; bottom: 84px; display: flex; gap: 10px; z-index: 10; }
  .ubtn { width: 44px; height: 44px; border-radius: 10px; cursor: pointer;
    background: linear-gradient(160deg, rgba(16,42,52,0.85), rgba(8,20,28,0.85));
    border: 1.5px solid rgba(110,225,235,0.55); color: #9feef4; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 10px rgba(60,190,210,0.25); transition: transform .12s, box-shadow .12s; }
  .ubtn:hover { transform: scale(1.08); box-shadow: 0 0 16px rgba(90,230,240,0.5); }
  .ubtn svg { width: 22px; height: 22px; }

  /* ---- HP / MP bar (bottom-center) ---- */
  #hpbarWrap { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); width: 520px; max-width: 60vw; z-index: 10; }
  #hpbar { height: 13px; border-radius: 7px; overflow: hidden; display: flex;
    background: rgba(8,16,22,0.75); border: 1px solid rgba(200,230,240,0.35);
    box-shadow: 0 0 14px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.15); }
  #hpfill { height: 100%; width: 70%; background: linear-gradient(180deg, #ffc592, #f2924e 50%, #d96f31);
    box-shadow: 0 0 8px rgba(255,160,80,0.7); transition: width .2s; }
  #mpfill { height: 100%; width: 30%; background: linear-gradient(180deg, #a9fff2, #3fd9c8 50%, #16a8a0);
    box-shadow: 0 0 8px rgba(80,230,215,0.7); transition: width .2s; }

  /* ---- skill buttons cluster (bottom-right) ---- */
  #skills { position: fixed; right: 30px; bottom: 26px; width: 300px; height: 240px; z-index: 10; }
  .skill { position: absolute; border-radius: 50%; cursor: pointer; user-select: none; -webkit-user-select: none;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, rgba(90,70,160,0.9), rgba(28,18,60,0.95) 70%);
    border: 2px solid rgba(150,200,255,0.55);
    box-shadow: 0 0 14px rgba(110,90,255,0.45), inset 0 0 12px rgba(0,0,0,0.6);
    transition: transform .1s, box-shadow .15s; }
  .skill:hover { transform: scale(1.07); box-shadow: 0 0 22px rgba(140,160,255,0.8), inset 0 0 12px rgba(0,0,0,0.6); }
  .skill:active { transform: scale(0.95); }
  .skill svg { width: 52%; height: 52%; filter: drop-shadow(0 0 4px rgba(180,230,255,0.9)); }
  .skill .key { position: absolute; bottom: -4px; right: -2px; font-size: 10px; color: #d6f4ff;
    background: rgba(10,20,40,0.85); border: 1px solid rgba(140,200,255,0.4); border-radius: 6px; padding: 1px 5px; }
  .skill .cd { position: absolute; inset: -2px; border-radius: 50%; pointer-events: none;
    background: conic-gradient(rgba(5,8,18,0.78) calc(var(--cd) * 1turn), transparent 0); }
  .skill.teal { background: radial-gradient(circle at 35% 30%, rgba(40,140,150,0.95), rgba(8,45,55,0.96) 70%);
    border-color: rgba(120,240,245,0.65); box-shadow: 0 0 14px rgba(60,220,230,0.5), inset 0 0 12px rgba(0,0,0,0.6); }
  .skill.red { background: radial-gradient(circle at 35% 30%, rgba(190,70,40,0.95), rgba(70,18,8,0.96) 70%);
    border-color: rgba(255,160,110,0.6); box-shadow: 0 0 14px rgba(255,110,60,0.5), inset 0 0 12px rgba(0,0,0,0.6); }
  .skill.gray { background: radial-gradient(circle at 35% 30%, rgba(120,125,135,0.9), rgba(35,38,46,0.96) 70%);
    border-color: rgba(200,210,220,0.5); }
  #btnSword  { width: 92px; height: 92px; right: 0;    bottom: 64px; }
  #btnBeam   { width: 68px; height: 68px; right: 86px; bottom: 132px; }
  #btnClaw   { width: 64px; height: 64px; right: -2px; bottom: 168px; }
  #btnDash   { width: 62px; height: 62px; right: 30px; bottom: 0; }
  #btnHeal   { width: 50px; height: 50px; right: 226px; bottom: 30px; }
  #btnShield { width: 50px; height: 50px; right: 168px; bottom: 16px; }
  #btnFire   { width: 50px; height: 50px; right: 112px; bottom: 6px; }

  /* ---- enemy hp bars / damage numbers ---- */
  #floaters { position: fixed; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; }
  .dmg { position: absolute; color: #ffe9a8; font-weight: 700; font-size: 20px;
    text-shadow: 0 0 6px rgba(255,140,40,0.9), 0 2px 3px rgba(0,0,0,0.8); transform: translate(-50%, -50%); }
  .dmg.heal { color: #a8ffd2; text-shadow: 0 0 6px rgba(60,255,150,0.9), 0 2px 3px rgba(0,0,0,0.8); }
  .ebar { position: absolute; width: 56px; height: 6px; transform: translate(-50%, -50%);
    background: rgba(10,14,20,0.8); border: 1px solid rgba(220,160,255,0.5); border-radius: 3px; overflow: hidden; }
  .ebar > div { height: 100%; background: linear-gradient(180deg, #e9a8ff, #a33ee0); }

  /* ---- overlays ---- */
  #title { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; background: radial-gradient(ellipse at center, rgba(8,20,30,0.82), rgba(4,8,14,0.96));
    color: #d9f4f6; cursor: pointer; }
  #title h1 { font-size: 46px; letter-spacing: 6px; font-weight: 700;
    background: linear-gradient(180deg, #eafdff, #6fd8e8 60%, #2f8fa8); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(90,220,235,0.35); }
  #title .sub { font-size: 15px; color: #9fcfd8; letter-spacing: 2px; }
  #title .start { margin-top: 16px; font-size: 18px; padding: 12px 44px; border-radius: 28px;
    border: 1.5px solid rgba(120,230,240,0.7); background: rgba(15,50,62,0.6); color: #c8f6fa;
    box-shadow: 0 0 18px rgba(70,210,225,0.4); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 32px rgba(90,235,245,0.75); } }
  #title .controls { margin-top: 18px; font-size: 13px; color: #8fb8c2; line-height: 1.9; text-align: center; }
  #title kbd { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 5px;
    padding: 1px 7px; font-family: inherit; }
  #gameover { position: fixed; inset: 0; z-index: 51; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px; background: rgba(10,4,8,0.85); color: #f4d9d9; }
  #gameover h2 { font-size: 40px; letter-spacing: 8px; color: #ff9d8a; text-shadow: 0 0 24px rgba(255,80,50,0.5); }
  #gameover button { font-size: 17px; padding: 11px 38px; border-radius: 24px; cursor: pointer;
    border: 1.5px solid rgba(255,170,150,0.7); background: rgba(70,20,18,0.6); color: #ffd9cf; }
  #hint { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 13px;
    color: #cfeef4; background: rgba(8,22,30,0.55); border: 1px solid rgba(120,220,230,0.25); border-radius: 18px;
    padding: 6px 18px; transition: opacity 1s; pointer-events: none; }
  #score { position: fixed; top: 22px; right: 28px; z-index: 10; color: #ffe9b8; font-size: 15px; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,180,60,0.5), 0 2px 3px rgba(0,0,0,0.7); text-align: right; line-height: 1.7; }
</style>
</head>

<div id="score">SCORE <span id="scoreVal">0</span><br><span style="font-size:12px;color:#bfe6ee">討伐 <span id="killVal">0</span></span></div>
<div id="hint">WASD移動 / マウスで視点 / 左クリック:剣 / 右クリック長押し:魔法ビーム / Space:ダッシュ</div>

  <h1>MIST OF RUINS</h1>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   Mist of Ruins — 三人称 冒険探索アクション
   ============================================================ */

const WORLD = 320;            // 地形の一辺
const WATER_Y = -0.45;

// ---------------- ユーティリティ ----------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
// フレームレート非依存の滑らかな追従係数
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const rand = (a, b) => a + Math.random() * (b - a);
function angleLerp(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

// ---------------- 地形ノイズ ----------------
function noise2(x, z) {
  return Math.sin(x * 1.7 + Math.sin(z * 1.3) * 2.1) * Math.cos(z * 1.1 + Math.sin(x * 0.7) * 1.6);
}
function fbm(x, z) {
  let a = 0, amp = 1, f = 1;
  for (let i = 0; i < 4; i++) { a += noise2(x * f * 0.05, z * f * 0.05) * amp; amp *= 0.5; f *= 2.1; }
  return a / 1.87;
}
function riverDist(x, z) {
  const cx = Math.sin(z * 0.035) * 18 + Math.cos(z * 0.012) * 10;
  const d1 = Math.abs(x - cx);
  const cz = Math.sin(x * 0.03) * 16 - 35;
  const d2 = Math.abs(z - cz);
  return Math.min(d1, d2);
}
function getHeight(x, z) {
  let h = fbm(x, z) * 3.2 + 2.4;
  h += Math.max(0, fbm(x * 0.4 + 53, z * 0.4 - 31)) * 3.0;           // 岩の隆起
  const edge = Math.max(Math.abs(x), Math.abs(z)) / (WORLD / 2);
  h += Math.max(0, edge - 0.78) * 26;                                 // 外周は山で囲う
  const d = riverDist(x, z);
  const t = clamp(1 - d / 11, 0, 1);
  h -= t * t * (3 - 2 * t) * 6.2;                                     // 川の谷
  return h;
}

// ---------------- 基本セットアップ ----------------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.className = 'webgl';
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc9e3ef, 55, 360);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1200);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------- 光 ----------------
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x5e9050, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1da, 2.3);
sun.position.set(60, 90, 35);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
sun.shadow.camera.top = 55; sun.shadow.camera.bottom = -55;
sun.shadow.camera.far = 320;
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// ---------------- 空 ----------------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(900, 32, 18),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uTop: { value: new THREE.Color(0x3f7fc9) }, uHorizon: { value: new THREE.Color(0xdcedf6) }, uSun: { value: new THREE.Vector3(60, 90, 35).normalize() } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vDir; uniform vec3 uTop, uHorizon, uSun;
      void main(){
        float h = clamp(vDir.y, 0.0, 1.0);
        vec3 c = mix(uHorizon, uTop, pow(h, 0.65));
        float s = pow(max(dot(vDir, uSun), 0.0), 80.0);
        c += vec3(1.0, 0.9, 0.7) * s * 0.9;
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
scene.add(sky);

// ---------------- テクスチャ生成 ----------------
function makeGlowTexture(inner = '#ffffff', outer = 'rgba(120,230,255,0)') {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, inner); grad.addColorStop(0.35, inner); grad.addColorStop(1, outer);
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTex = makeGlowTexture('#dffaff');
const glowTexWarm = makeGlowTexture('#fff3d0', 'rgba(255,200,110,0)');

function makeCloudTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  for (let i = 0; i < 22; i++) {
    const x = rand(40, 216), y = rand(45, 85), r = rand(18, 45);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(255,255,255,0.55)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---------------- 地形 ----------------
const SEG = 150;
const groundGeo = new THREE.PlaneGeometry(WORLD, WORLD, SEG, SEG);
groundGeo.rotateX(-Math.PI / 2);
{
  const pos = groundGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cGrass = new THREE.Color(0x5d9e44), cGrass2 = new THREE.Color(0x7cb858);
  const cRock = new THREE.Color(0x8d8a80), cSand = new THREE.Color(0x9aa06a), cTmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = getHeight(x, z);
    pos.setY(i, h);
    const n = fbm(x * 2 + 11, z * 2 - 7) * 0.5 + 0.5;
    cTmp.copy(cGrass).lerp(cGrass2, n);
    if (h > 6.5) cTmp.lerp(cRock, clamp((h - 6.5) / 4, 0, 1));
    if (h < WATER_Y + 0.7) cTmp.lerp(cSand, clamp((WATER_Y + 0.7 - h) / 1.2, 0, 1));

function makePillar(broken = Math.random() < 0.5) {
  const g = new THREE.Group();
  const h = broken ? rand(2, 4.5) : rand(5.5, 8);

  shaft.position.y = 0.6 + h / 2;
  shaft.rotation.y = rand(0, 1);

  if (!broken) {
    const cap = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 1.5), stoneDark);
    cap.position.y = 0.6 + h + 0.25; g.add(cap);
  } else {
    shaft.rotation.x = rand(-0.07, 0.07);
  }
  const moss = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.64, h * 0.3, 9, 1), mossMat);

  const shirt = mat(0xe3dccb), pants = mat(0x3d566e), skin = mat(0xeab890),

  torso.position.y = 0.32; hips.add(torso);
  const scarf = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.16, 0.38), scarfM);
  scarf.position.y = 0.62; hips.add(scarf);
  const scarfTail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.06), scarfM);
  scarfTail.position.set(0.08, 0.36, -0.22); scarfTail.rotation.x = 0.18; hips.add(scarfTail);

  const strap = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.1, 0.36), mat(0x6e4622));
  strap.position.y = 0.5; hips.add(strap);

  const head = new THREE.Group(); head.position.y = 0.82; hips.add(head);
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.21, 12, 10), skin); head.add(face);
  const hairM = new THREE.Mesh(new THREE.SphereGeometry(0.235, 12, 10), hair);
  hairM.position.set(0, 0.05, -0.03); hairM.scale.set(1, 0.92, 1); head.add(hairM);
  const fringe = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.1), hair);
  fringe.position.set(0, 0.13, 0.16); head.add(fringe);

  function arm(side) {
    const a = new THREE.Group();
    a.position.set(0.33 * side, 0.55, 0);
    const upper = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.52, 0.15), shirt);
    upper.position.y = -0.24; a.add(upper);
    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.14, 0.13), skin);
    hand.position.y = -0.55; a.add(hand);
    const tip = new THREE.Object3D(); tip.position.y = -0.62; a.add(tip);
    hips.add(a);
    return { g: a, tip };
  }
  const armL = arm(-1), armR = arm(1);

  // 剣(右手)
  const sword = new THREE.Group();
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.95, 0.14),
    new THREE.MeshStandardMaterial({ color: 0xcfd8e2, roughness: 0.25, metalness: 0.85, emissive: 0x335566, emissiveIntensity: 0.25 }));
  blade.position.y = 0.62; sword.add(blade);

  guard.position.y = 0.12; sword.add(guard);

  sword.add(grip);
  sword.position.y = -0.58;

  function leg(side) {

    return l;
  }
  const legL = leg(-1), legR = leg(1);

  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { g, hips, head, armL, armR, legL, legR, sword };
}

const bursts = [];
function burst(pos, color = 0x9a4fff, count = 26, speed = 7, size = 0.4) {
  const geo = new THREE.BufferGeometry();
  const p = new Float32Array(count * 3);
  const v = [];
  for (let i = 0; i < count; i++) {
    p[i * 3] = pos.x; p[i * 3 + 1] = pos.y; p[i * 3 + 2] = pos.z;
    const th = rand(0, Math.PI * 2), ph = rand(-1, 1);
    const s = rand(speed * 0.3, speed);
    v.push(new THREE.Vector3(Math.cos(th) * Math.sqrt(1 - ph * ph) * s, ph * s + speed * 0.35, Math.sin(th) * Math.sqrt(1 - ph * ph) * s));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size, map: glowTex, color, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(pts);
  bursts.push({ pts, v, life: 0.9, t: 0 });
}
function updateBursts(dt) {
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.t += dt;
    const arr = b.pts.geometry.attributes.position;
    for (let j = 0; j < b.v.length; j++) {
      b.v[j].y -= 9 * dt;
      arr.setXYZ(j, arr.getX(j) + b.v[j].x * dt, arr.getY(j) + b.v[j].y * dt, arr.getZ(j) + b.v[j].z * dt);
    }
    arr.needsUpdate = true;
    b.pts.material.opacity = 1 - b.t / b.life;
    if (b.t >= b.life) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); }
  }
}

const AC = window.AudioContext || window.webkitAudioContext;
const audio = AC ? new AC() : null;
let beamOsc = null;
function blip(freq, dur, type = 'square', vol = 0.18, slide = 0.6) {
  if (!audio) return;
  const o = audio.createOscillator(), gn = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), audio.currentTime + dur);
  gn.gain.setValueAtTime(vol, audio.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  o.connect(gn).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur);
}
const sfx = {
  slash() { blip(420, 0.14, 'sawtooth', 0.13, 0.4); blip(900, 0.08, 'square', 0.06, 0.3); },
  hit() { blip(180, 0.16, 'square', 0.16, 0.5); },
  fireball() { blip(220, 0.5, 'sawtooth', 0.14, 0.25); },
  heal() { blip(520, 0.3, 'sine', 0.14, 1.6); blip(780, 0.4, 'sine', 0.1, 1.5); },
  dash() { blip(300, 0.22, 'sine', 0.12, 2.2); },
  hurt() { blip(140, 0.3, 'sawtooth', 0.2, 0.5); },
  die() { blip(90, 0.9, 'sawtooth', 0.22, 0.3); },
  pickup() { blip(880, 0.18, 'sine', 0.12, 1.5); blip(1320, 0.25, 'sine', 0.08, 1.2); },
  enemyDie() { blip(320, 0.4, 'square', 0.14, 0.2); },
  shield() { blip(440, 0.35, 'triangle', 0.13, 1.3); },
  beamStart() {
    if (!audio || beamOsc) return;
    const o = audio.createOscillator(), gn = audio.createGain(), lfo = audio.createOscillator(), lg = audio.createGain();
    o.type = 'sawtooth'; o.frequency.value = 160;
    lfo.frequency.value = 22; lg.gain.value = 28;
    lfo.connect(lg).connect(o.frequency);
    gn.gain.setValueAtTime(0.0001, audio.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.07, audio.currentTime + 0.12);
    o.connect(gn).connect(audio.destination);
    o.start(); lfo.start();
    beamOsc = { o, gn, lfo };
  },
  beamStop() {
    if (!beamOsc) return;
    const { o, gn, lfo } = beamOsc;
    gn.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.15);
    o.stop(audio.currentTime + 0.2); lfo.stop(audio.currentTime + 0.2);
    beamOsc = null;
  }
};

const cooldowns = { sword: 0, claw: 0, dash: 0, heal: 0, shield: 0, fire: 0 };
const cdMax = { sword: 0.45, claw: 4, dash: 1.6, heal: 9, shield: 12, fire: 2.5 };
const cdEls = {
  sword: document.querySelector('#btnSword .cd'), claw: document.querySelector('#btnClaw .cd'),
  dash: document.querySelector('#btnDash .cd'), heal: document.querySelector('#btnHeal .cd'),
  shield: document.querySelector('#btnShield .cd'), fire: document.querySelector('#btnFire .cd'),
};

function camForward() {
  return new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw)).normalize();
}
function trySkill(name) {
  if (!started || player.dead || cooldowns[name] > 0) return;
  switch (name) {
    case 'sword':
      if (player.attackT > 0 || player.spinT > 0) return;
      player.attackT = 0.38;
      player.attackDir *= -1;
      cooldowns.sword = cdMax.sword;
      sfx.slash();
      meleeHit(2.9, Math.PI * 0.85, 34);
      break;
    case 'claw':
      if (player.spinT > 0) return;
      player.spinT = 0.55;
      cooldowns.claw = cdMax.claw;
      sfx.slash(); setTimeout(() => sfx.slash(), 140);
      meleeHit(3.4, Math.PI * 2, 50);
      break;
    case 'dash': {
      cooldowns.dash = cdMax.dash;
      player.dashT = 0.28;
      sfx.dash();
      const f = camForward();
      const iv = inputVec();
      const dir = iv.lengthSq() > 0 ? iv : f;
      player.vel.x = dir.x * 26; player.vel.z = dir.z * 26;
      break;
    }
    case 'heal':
      if (player.mp < 30 || player.hp >= player.maxHp) return;
      player.mp -= 30;
      cooldowns.heal = cdMax.heal;
      player.hp = Math.min(player.maxHp, player.hp + 40);
      sfx.heal();
      showDamage(player.pos.clone().add(new THREE.Vector3(0, 2.2, 0)), '+40', true);
      burst(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 0x7dffb8, 22, 4, 0.35);
      break;
    case 'shield':
      if (player.mp < 25) return;
      player.mp -= 25;
      cooldowns.shield = cdMax.shield;
      player.shieldT = 6;
      sfx.shield();
      break;
    case 'fire': {
      if (player.mp < 18) return;
      player.mp -= 18;
      cooldowns.fire = cdMax.fire;
      sfx.fireball();
      player.castT = Math.max(player.castT, 0.3);
      const origin = player.pos.clone().add(new THREE.Vector3(0, 1.4, 0));
      shootFireball(origin, camForward());
      break;
    }
  }
}
// 前方範囲攻撃
function meleeHit(range, arc, dmg) {
  const f = new THREE.Vector3(Math.sin(player.heading), 0, Math.cos(player.heading));
  for (const e of enemies) {
    if (e.dead) continue;
    const to = new THREE.Vector3().subVectors(e.pos, player.pos); to.y = 0;
    const d = to.length();
    if (d > range) continue;
    to.normalize();
    if (arc < Math.PI * 2 && f.dot(to) < Math.cos(arc / 2)) continue;
    damageEnemy(e, dmg + (Math.random() * 8 | 0), to);
  }
}
function damageEnemy(e, dmg, knockDir = null) {
  if (e.dead) return;
  e.hp -= dmg;
  e.hitFlash = 0.18;
  e.state = 'chase';
  showDamage(e.pos.clone().add(new THREE.Vector3(rand(-0.4, 0.4), 2.3, 0)), Math.round(dmg));
  sfx.hit();
  if (knockDir) { e.pos.x += knockDir.x * 0.5; e.pos.z += knockDir.z * 0.5; }
  if (e.hp <= 0) {
    e.dead = true;
    sfx.enemyDie();
    burst(e.pos.clone().add(new THREE.Vector3(0, 1.4, 0)), 0xb86fff, 36, 8, 0.5);
    burst(e.pos.clone().add(new THREE.Vector3(0, 1.4, 0)), 0xfff0c8, 14, 5, 0.3);
    scene.remove(e.model.g);
    e.bar.remove();
    kills++; score += 120;
    updateScore();
  }
}

function inputVec() {
  const f = camForward();
  const r = new THREE.Vector3(-f.z, 0, f.x);
  const v = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp']) v.add(f);
  if (keys['KeyS'] || keys['ArrowDown']) v.sub(f);
  if (keys['KeyA'] || keys['ArrowLeft']) v.sub(r);
  if (keys['KeyD'] || keys['ArrowRight']) v.add(r);
  if (v.lengthSq() > 0) v.normalize();
  return v;
}

const mmCanvas = document.getElementById('minimap');

// 地形を一度だけ描いてキャッシュ
const mapImg = document.createElement('canvas');
mapImg.width = mapImg.height = 256;
{
  const g = mapImg.getContext('2d');
  const img = g.createImageData(256, 256);
  for (let py = 0; py < 256; py++) {
    for (let px = 0; px < 256; px++) {
      const x = (px / 256 - 0.5) * WORLD, z = (py / 256 - 0.5) * WORLD;
      const h = getHeight(x, z);
      let r, gg, b;
      if (h < WATER_Y) { r = 40; gg = 120 + h * 6; b = 150; }
      else if (h > 7) { r = 130; gg = 126; b = 116; }
      else { const t = clamp(h / 7, 0, 1); r = 70 + t * 40; gg = 130 + t * 30; b = 60 + t * 20; }
      const i = (py * 256 + px) * 4;
      img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
}
function drawMinimap() {
  const S = mmCanvas.width, C = S / 2;
  const viewR = 70;  // 表示半径(ワールド単位)
  const scl = C / viewR;
  mmCtx.clearRect(0, 0, S, S);
  mmCtx.save();
  mmCtx.beginPath(); mmCtx.arc(C, C, C - 4, 0, 7); mmCtx.clip();
  mmCtx.fillStyle = '#0a242e'; mmCtx.fillRect(0, 0, S, S);
  // 地形(北固定)
  const imgScale = (WORLD / 256);
  mmCtx.imageSmoothingEnabled = true;
  mmCtx.drawImage(mapImg,
    (player.pos.x + WORLD / 2) / imgScale - viewR / imgScale,
    (player.pos.z + WORLD / 2) / imgScale - viewR / imgScale,
    viewR * 2 / imgScale, viewR * 2 / imgScale,
    0, 0, S, S);
  // 敵
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = (e.pos.x - player.pos.x) * scl, dz = (e.pos.z - player.pos.z) * scl;
    if (dx * dx + dz * dz > (C - 8) * (C - 8)) continue;
    mmCtx.fillStyle = '#ff5a6e';
    mmCtx.beginPath(); mmCtx.arc(C + dx, C + dz, 5, 0, 7); mmCtx.fill();
  }
  // クリスタル
  mmCtx.fillStyle = '#6fe8ff';
  for (const cst of crystals) {
    if (!cst.visible) continue;
    const dx = (cst.position.x - player.pos.x) * scl, dz = (cst.position.z - player.pos.z) * scl;
    if (dx * dx + dz * dz > (C - 8) * (C - 8)) continue;
    mmCtx.beginPath(); mmCtx.arc(C + dx, C + dz, 3.5, 0, 7); mmCtx.fill();
  }
  // 神殿マーカー
  {
    const dx = clamp((-34 - player.pos.x) * scl, -C + 14, C - 14), dz = clamp((-52 - player.pos.z) * scl, -C + 14, C - 14);
    mmCtx.fillStyle = '#ffc36e';
    mmCtx.font = 'bold 16px sans-serif';
    mmCtx.fillText('⌂', C + dx - 6, C + dz + 6);
  }
  // 視野扇(画面上は +x 右 / +z 下)
  const f = camForward();
  const coneA = Math.atan2(f.z, f.x);
  const grad = mmCtx.createRadialGradient(C, C, 0, C, C, 36);
  grad.addColorStop(0, 'rgba(160,240,250,0.4)'); grad.addColorStop(1, 'rgba(160,240,250,0)');
  mmCtx.fillStyle = grad;
  mmCtx.beginPath();
  mmCtx.moveTo(C, C);
  mmCtx.arc(C, C, 36, coneA - 0.5, coneA + 0.5);
  mmCtx.closePath(); mmCtx.fill();
  // プレイヤー矢印
  const hx = Math.sin(player.heading), hz = Math.cos(player.heading);
  const pa = Math.atan2(hz, hx);
  mmCtx.save();
  mmCtx.translate(C, C);
  mmCtx.rotate(pa + Math.PI / 2);
  mmCtx.fillStyle = '#eafdff';
  mmCtx.strokeStyle = '#15323a';
  mmCtx.beginPath();
  mmCtx.moveTo(0, -8); mmCtx.lineTo(6, 7); mmCtx.lineTo(0, 3.5); mmCtx.lineTo(-6, 7);
  mmCtx.closePath(); mmCtx.fill(); mmCtx.stroke();
  mmCtx.restore();
  mmCtx.restore();
}

const cpCanvas = document.getElementById('compass');
const cpCtx = cpCanvas.getContext('2d');
const RUNES = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒ';
function drawCompass(t) {
  const S = cpCanvas.width, C = S / 2;
  cpCtx.clearRect(0, 0, S, S);
  const f = camForward();
  const rot = Math.atan2(f.x, -f.z);
  // 外環
  cpCtx.save();
  cpCtx.translate(C, C);
  cpCtx.strokeStyle = 'rgba(140,225,235,0.5)';
  cpCtx.lineWidth = 3;
  cpCtx.beginPath(); cpCtx.arc(0, 0, C - 8, 0, 7); cpCtx.stroke();
  cpCtx.strokeStyle = 'rgba(140,225,235,0.25)';
  cpCtx.beginPath(); cpCtx.arc(0, 0, C - 30, 0, 7); cpCtx.stroke();
  // ルーン環(カメラと逆回転)
  cpCtx.rotate(-rot);
  cpCtx.fillStyle = 'rgba(180,240,248,0.75)';
  cpCtx.font = '19px serif';
  cpCtx.textAlign = 'center'; cpCtx.textBaseline = 'middle';
  for (let i = 0; i < RUNES.length; i++) {
    const a = (i / RUNES.length) * Math.PI * 2;
    cpCtx.save();
    cpCtx.rotate(a);
    cpCtx.translate(0, -(C - 19));
    cpCtx.fillText(RUNES[i], 0, 0);
    cpCtx.restore();
  }
  // 方位
  cpCtx.fillStyle = 'rgba(255,235,180,0.9)';
  cpCtx.font = 'bold 17px sans-serif';
  cpCtx.fillText('N', 0, -(C - 44));
  cpCtx.fillStyle = 'rgba(190,230,240,0.6)';
  cpCtx.fillText('S', 0, C - 44);
  cpCtx.fillText('E', C - 44, 0);
  cpCtx.fillText('W', -(C - 44), 0);
  cpCtx.restore();
  // 内側の装飾針(時計風にゆっくり回転)
  cpCtx.save();
  cpCtx.translate(C, C);
  cpCtx.rotate(t * 0.15);
  cpCtx.strokeStyle = 'rgba(170,235,245,0.8)';
  cpCtx.lineWidth = 2.5;
  cpCtx.beginPath(); cpCtx.moveTo(0, 8); cpCtx.lineTo(0, -(C - 38)); cpCtx.stroke();
  cpCtx.rotate(t * 0.6);
  cpCtx.strokeStyle = 'rgba(255,220,170,0.7)';
  cpCtx.beginPath(); cpCtx.moveTo(0, 6); cpCtx.lineTo(0, -(C - 58)); cpCtx.stroke();
  cpCtx.fillStyle = '#bff0f6';
  cpCtx.beginPath(); cpCtx.arc(0, 0, 4.5, 0, 7); cpCtx.fill();
  cpCtx.restore();
}

// ---------------- スコア ----------------
let score = 0, kills = 0, crystalGot = 0;
function updateScore() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('killVal').textContent = kills;
  document.getElementById('crystalCount').textContent = crystalGot;
}

// ============================================================
//  メインループ
// ============================================================
let started = false;
const titleEl = document.getElementById('title');
titleEl.addEventListener('click', () => {
  started = true;
  titleEl.style.display = 'none';
  if (audio && audio.state === 'suspended') audio.resume();
  canvas.requestPointerLock();
  const h = document.getElementById('hint');
  h._t = setTimeout(() => h.style.opacity = 0, 9000);
});
document.getElementById('goRetry').addEventListener('click', () => {
  player.hp = player.maxHp; player.mp = player.maxMp;
  player.dead = false;
  player.pos.set(4, 0, 18);
  player.pos.y = getHeight(4, 18);
  player.vel.set(0, 0, 0);
  document.getElementById('gameover').style.display = 'none';
});

function hurtPlayer(dmg) {
  if (player.dead || player.hurtCd > 0 || player.dashT > 0) return;
  if (player.shieldT > 0) dmg *= 0.25;
  player.hp -= dmg;
  player.hurtCd = 0.5;
  sfx.hurt();
  const hurtEl = document.getElementById('hurt');
  hurtEl.style.opacity = 1;
  setTimeout(() => hurtEl.style.opacity = 0, 220);
  if (player.hp <= 0) {
    player.hp = 0;
    player.dead = true;
    sfx.die();
    sfx.beamStop();
    document.exitPointerLock?.();
    document.getElementById('goScore').textContent = `SCORE ${score} ／ 討伐 ${kills} ／ クリスタル ${crystalGot}`;
    document.getElementById('gameover').style.display = 'flex';
  }
}

const clock = new THREE.Clock();
const camPos = new THREE.Vector3(8, 6, 26);
const camTarget = new THREE.Vector3();
const beamEnd = new THREE.Vector3();

function update(dt, t) {
  // ----- クールダウン -----
  for (const k in cooldowns) {
    if (cooldowns[k] > 0) cooldowns[k] = Math.max(0, cooldowns[k] - dt);
    cdEls[k].style.setProperty('--cd', cooldowns[k] / cdMax[k]);
  }
  player.hurtCd = Math.max(0, player.hurtCd - dt);
  player.shieldT = Math.max(0, player.shieldT - dt);
  player.mp = Math.min(player.maxMp, player.mp + 9 * dt);
  player.hp = Math.min(player.maxHp, player.hp + 0.8 * dt);

  // ----- プレイヤー移動 -----
  // MP残量にヒステリシスを持たせてビームの点滅を防ぐ
  const beaming = beamWanted && !player.dead && (beamGroup.visible ? player.mp > 0.5 : player.mp > 8);
  const iv = player.dead ? new THREE.Vector3() : inputVec();
  const walking = keys['ShiftLeft'] || keys['ShiftRight'];
  const baseSpeed = beaming ? 2.6 : (walking ? 3.2 : 8.0);
  const targetVx = iv.x * baseSpeed, targetVz = iv.z * baseSpeed;
  const accel = player.dashT > 0 ? 0 : damp(10, dt);
  player.vel.x = lerp(player.vel.x, targetVx, accel);
  player.vel.z = lerp(player.vel.z, targetVz, accel);
  player.dashT = Math.max(0, player.dashT - dt);

  let nx = player.pos.x + player.vel.x * dt;
  let nz = player.pos.z + player.vel.z * dt;
  // コリジョン(円柱押し出し)
  for (const c of collidables) {
    const dx = nx - c.x, dz = nz - c.z;
    const d = Math.hypot(dx, dz), min = c.r + 0.45;
    if (d < min && d > 0.001) { nx = c.x + dx / d * min; nz = c.z + dz / d * min; }
  }
  nx = clamp(nx, -WORLD / 2 + 6, WORLD / 2 - 6);
  nz = clamp(nz, -WORLD / 2 + 6, WORLD / 2 - 6);
  player.pos.x = nx; player.pos.z = nz;
  const gy = getHeight(nx, nz);
  player.pos.y = lerp(player.pos.y, gy, damp(18, dt));   // 段差もなめらかに

  // 向き: ビーム中はカメラ正面、移動中は移動方向
  const hSpeed = Math.hypot(player.vel.x, player.vel.z);
  if (beaming) {
    player.heading = angleLerp(player.heading, camYaw + Math.PI, damp(14, dt));
  } else if (hSpeed > 0.5) {
    player.heading = angleLerp(player.heading, Math.atan2(player.vel.x, player.vel.z), damp(12, dt));
  }

  // ----- プレイヤーアニメーション -----
  const pm = playerModel;
  pm.g.position.copy(player.pos);
  pm.g.rotation.y = player.heading;
  const runRatio = clamp(hSpeed / 8, 0, 1);
  pm._phase = (pm._phase || 0) + hSpeed * dt * 1.45;
  const ph = pm._phase;
  const swing = Math.sin(ph) * 0.85 * runRatio;
  pm.legL.rotation.x = swing;
  pm.legR.rotation.x = -swing;
  pm.hips.position.y = 0.92 + Math.abs(Math.sin(ph)) * 0.07 * runRatio + Math.sin(t * 1.8) * 0.012;
  pm.hips.rotation.x = runRatio * 0.14;
  pm.head.rotation.x = -runRatio * 0.1 + Math.sin(t * 1.3) * 0.02;

  player.castT = Math.max(0, player.castT - dt);
  if (player.attackT > 0) {
    player.attackT -= dt;
    const k = 1 - clamp(player.attackT / 0.38, 0, 1);  // 0→1
    const e = k < 0.4 ? k / 0.4 : 1 - (k - 0.4) / 0.6 * 0.3;
    pm.armR.g.rotation.x = -2.0 * e;
    pm.armR.g.rotation.z = player.attackDir * (0.9 - 1.8 * k);
    slashTrail.material.opacity = Math.max(0, 0.85 * (1 - k * 1.3));
    slashTrail.position.copy(player.pos).add(new THREE.Vector3(0, 1.25, 0));
    slashTrail.rotation.z = -player.heading + Math.PI / 2 + player.attackDir * (1.6 - k * 3.2);
    slashTrail.scale.setScalar(0.8 + k * 0.7);
  } else if (player.spinT > 0) {
    player.spinT -= dt;
    const k = 1 - clamp(player.spinT / 0.55, 0, 1);
    pm.g.rotation.y = player.heading + k * Math.PI * 2 * 1.0;
    pm.armR.g.rotation.x = -Math.PI / 2.4;
    pm.armL.g.rotation.x = -Math.PI / 2.6;
    slashTrail.material.opacity = 0.8 * Math.sin(k * Math.PI);
    slashTrail.position.copy(player.pos).add(new THREE.Vector3(0, 1.25, 0));
    slashTrail.rotation.z = -pm.g.rotation.y + Math.PI / 2;
    slashTrail.scale.setScalar(1.4);
  } else if (beaming) {
    pm.armR.g.rotation.x = lerp(pm.armR.g.rotation.x, -Math.PI / 2 + camPitch * 0.6, damp(16, dt));
    pm.armR.g.rotation.z = lerp(pm.armR.g.rotation.z, 0, damp(16, dt));
    pm.armL.g.rotation.x = lerp(pm.armL.g.rotation.x, -0.5 - Math.sin(ph) * 0.2 * runRatio, damp(10, dt));
    slashTrail.material.opacity = Math.max(0, slashTrail.material.opacity - dt * 5);
  } else if (player.castT > 0) {
    pm.armR.g.rotation.x = -Math.PI / 2;
    slashTrail.material.opacity = Math.max(0, slashTrail.material.opacity - dt * 5);
  } else {
    pm.armR.g.rotation.x = lerp(pm.armR.g.rotation.x, -swing * 0.6, damp(10, dt));
    pm.armR.g.rotation.z = lerp(pm.armR.g.rotation.z, 0.12, damp(10, dt));
    pm.armL.g.rotation.x = lerp(pm.armL.g.rotation.x, swing * 0.6, damp(10, dt));
    slashTrail.material.opacity = Math.max(0, slashTrail.material.opacity - dt * 5);
  }
  pm.armL.g.rotation.z = lerp(pm.armL.g.rotation.z, -0.12, damp(10, dt));

  // バリア表示
  shieldFx.position.copy(player.pos).add(new THREE.Vector3(0, 1.1, 0));
  shieldFx.material.opacity = player.shieldT > 0 ? 0.16 + Math.sin(t * 6) * 0.05 : 0;
  shieldFx.rotation.y = t * 0.8;

  // ----- 魔法ビーム -----
  if (beaming) {
    if (!beamGroup.visible) { beamGroup.visible = true; sfx.beamStart(); }
    player.mp = Math.max(0, player.mp - 16 * dt);
    const hand = new THREE.Vector3();
    pm.armR.tip.getWorldPosition(hand);
    const dir = new THREE.Vector3(-Math.sin(camYaw), Math.sin(-camPitch) * 0.55, -Math.cos(camYaw)).normalize();
    // 敵にスナップ(ビーム軸との距離が近い敵)
    let bestT = 28, hitEnemy = null;
    for (const e of enemies) {
      if (e.dead) continue;
      const toE = new THREE.Vector3().subVectors(e.pos, hand).add(new THREE.Vector3(0, 1.4, 0));
      const along = toE.dot(dir);
      if (along < 1 || along > 30) continue;
      const perp = toE.clone().addScaledVector(dir, -along).length();
      if (perp < 2.2 && along < bestT + 2) { bestT = along; hitEnemy = e; }
    }
    beamEnd.copy(hand).addScaledVector(dir, bestT);
    if (hitEnemy) {
      beamEnd.copy(hitEnemy.pos).add(new THREE.Vector3(0, 1.4, 0));
      // ダメージはまとめて適用(数字と効果音の毎フレーム連発を防ぐ)
      hitEnemy.beamAcc = (hitEnemy.beamAcc || 0) + 46 * dt;
      hitEnemy.hitFlash = 0.1;
      if (hitEnemy.beamAcc >= 10) { const d = Math.round(hitEnemy.beamAcc); hitEnemy.beamAcc = 0; damageEnemy(hitEnemy, d); }
    } else {
      const groundT = beamEnd.y < getHeight(beamEnd.x, beamEnd.z);
      if (groundT) beamEnd.y = getHeight(beamEnd.x, beamEnd.z) + 0.2;
    }
    const len = hand.distanceTo(beamEnd);
    beamGroup.position.copy(hand);
    beamGroup.lookAt(beamEnd);
    beamCore.scale.set(1 + Math.sin(t * 30) * 0.15, 1 + Math.sin(t * 30) * 0.15, len);
    beamOuter.scale.set(2.6 + Math.sin(t * 22) * 0.4, 2.6 + Math.sin(t * 22) * 0.4, len);
    beamImpact.position.set(0, 0, len);
    beamImpact.scale.setScalar(2.6 + Math.sin(t * 26) * 0.7);
    beamLight.position.set(0, 0, Math.min(len, 6));
    beamLight.intensity = 26;
    // 火花を線上に散らす
    const arr = beamSparkGeo.attributes.position;
    for (let i = 0; i < BEAM_SPARKS; i++) {
      const along = Math.random() * len;
      arr.setXYZ(i, rand(-0.5, 0.5) * (along / len + 0.2), rand(-0.5, 0.5) * (along / len + 0.2), along);
    }
    arr.needsUpdate = true;
    if (Math.random() < dt * 22) burst(beamEnd, 0x9af2ff, 4, 3, 0.3);
  } else if (beamGroup.visible) {
    beamGroup.visible = false;
    beamLight.intensity = 0;
    sfx.beamStop();
  }

  // ----- ファイアボール -----
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i];
    fb.life -= dt;
    fb.g.position.addScaledVector(fb.dir, 22 * dt);
    let explode = fb.life <= 0 || fb.g.position.y < getHeight(fb.g.position.x, fb.g.position.z) + 0.2;
    for (const e of enemies) {
      if (e.dead) continue;
      if (fb.g.position.distanceTo(e.pos.clone().add(new THREE.Vector3(0, 1.4, 0))) < 1.6) explode = true;
    }
    if (explode) {
      burst(fb.g.position, 0xffaa50, 34, 9, 0.55);
      burst(fb.g.position, 0xfff3c8, 16, 5, 0.4);
      blip(90, 0.4, 'sawtooth', 0.2, 0.4);
      for (const e of enemies) {
        if (e.dead) continue;
        const d = fb.g.position.distanceTo(e.pos.clone().add(new THREE.Vector3(0, 1.4, 0)));
        if (d < 4.5) damageEnemy(e, 55 * clamp(1 - d / 5, 0.3, 1));
      }
      scene.remove(fb.g);
      fireballs.splice(i, 1);
    }
  }

  // ----- 敵 -----
  for (const e of enemies) {
    if (e.dead) continue;
    const toP = new THREE.Vector3().subVectors(player.pos, e.pos); toP.y = 0;
    const dist = toP.length();
    if (e.state === 'wander') {
      if (dist < 22 && !player.dead) e.state = 'chase';
      if (e.pos.distanceTo(e.target) < 1.5 || Math.random() < dt * 0.2) {
        e.target.set(e.home.x + rand(-12, 12), 0, e.home.z + rand(-12, 12));
      }
      const dirW = new THREE.Vector3().subVectors(e.target, e.pos); dirW.y = 0;
      if (dirW.lengthSq() > 1) {
        dirW.normalize();
        e.pos.x += dirW.x * 1.6 * dt; e.pos.z += dirW.z * 1.6 * dt;
      }
    } else { // chase
      if (dist > 38 || player.dead) e.state = 'wander';
      if (dist > 2.4) {
        toP.normalize();
        const sp = 4.4;
        e.pos.x += toP.x * sp * dt; e.pos.z += toP.z * sp * dt;
        e.windup = 0;
      } else {
        e.windup += dt;
        if (e.windup > 0.7) {
          e.windup = 0;
          hurtPlayer(12 + Math.random() * 6);
          burst(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 0xc06fff, 10, 4, 0.3);
        }
      }
    }
    e.pos.y = lerp(e.pos.y, getHeight(e.pos.x, e.pos.z), damp(10, dt));
    // 演出
    const m = e.model;
    m.core.position.y = 1.5 + Math.sin(t * 2 + e.ph) * 0.15;
    m.core.rotation.y += dt * (e.state === 'chase' ? 3 : 0.8);
    m.core.rotation.x += dt * 0.7;
    const flash = e.hitFlash > 0;
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    m.core.material.emissiveIntensity = flash ? 3.2 : (e.windup > 0.35 ? 2.4 : 1.1);
    m.eye.material.opacity = 0.75 + Math.sin(t * 5 + e.ph) * 0.2;
    m.eye.position.y = m.core.position.y;
    for (const r of m.rocks) {
      r.userData.a += dt * r.userData.sp;
      r.position.set(Math.cos(r.userData.a) * r.userData.rad, r.userData.h + Math.sin(t * 1.6 + r.userData.a * 2) * 0.12, Math.sin(r.userData.a) * r.userData.rad);
    }
    // HPバー
    const sp2 = projectToScreen(e.pos.clone().add(new THREE.Vector3(0, 2.9, 0)));
    if (sp2.behind || dist > 45) { e.bar.style.display = 'none'; }
    else {
      e.bar.style.display = 'block';
      e.bar.style.left = sp2.x + 'px'; e.bar.style.top = sp2.y + 'px';
      e.barFill.style.width = (e.hp / e.maxHp * 100) + '%';
    }
  }
  // リスポーン
  respawnTimer += dt;
  if (respawnTimer > 6) {
    respawnTimer = 0;
    const alive = enemies.filter(e => !e.dead).length;
    if (alive < 8) {
      const sp = enemySpawns[(Math.random() * enemySpawns.length) | 0];
      if (Math.hypot(sp[0] - player.pos.x, sp[1] - player.pos.z) > 30) spawnEnemy(sp[0], sp[1]);
    }
  }

  // ----- クリスタル -----
  for (const cst of crystals) {
    if (!cst.visible) continue;
    cst.rotation.y += dt * 1.4;
    cst.position.y += Math.sin(t * 2 + cst.userData.ph) * 0.004;
    if (cst.position.distanceTo(player.pos.clone().add(new THREE.Vector3(0, 1, 0))) < 1.7) {
      cst.visible = false;
      crystalGot++; score += 60;
      updateScore();
      sfx.pickup();
      burst(cst.position, 0x8ff4ff, 24, 5, 0.4);
      player.mp = Math.min(player.maxMp, player.mp + 25);
    }
  }

  // ----- 環境アニメ -----
  waterUniforms.uTime.value = t;
  grassUniform.value = t;
  for (const isl of islands) {
    isl.position.y = isl.userData.baseY + Math.sin(t * isl.userData.sp + isl.userData.ph) * 2.2;
    isl.rotation.y += dt * 0.02;
  }
  for (const c of clouds) {
    c.position.x += c.userData.v * dt;
    if (c.position.x > 560) c.position.x = -560;
  }
  fireflies.material.opacity = 0.65 + Math.sin(t * 1.7) * 0.25;
  fireflies.rotation.y = Math.sin(t * 0.05) * 0.02;

  // ----- カメラ -----
  const dist = 5.4, height = 2.3;
  const desired = new THREE.Vector3(
    player.pos.x + Math.sin(camYaw) * dist * Math.cos(camPitch),
    player.pos.y + height + Math.sin(camPitch) * dist,
    player.pos.z + Math.cos(camYaw) * dist * Math.cos(camPitch)
  );
  // カメラの地面めり込み防止
  const camGround = getHeight(desired.x, desired.z) + 0.5;
  if (desired.y < camGround) desired.y = camGround;
  camPos.lerp(desired, damp(beaming ? 14 : 7, dt));
  camera.position.copy(camPos);
  camTarget.lerp(new THREE.Vector3(player.pos.x, player.pos.y + 1.5, player.pos.z), damp(12, dt));
  camera.lookAt(camTarget);

  // 太陽の影をプレイヤー周辺に追従
  sun.position.set(player.pos.x + 60, 90, player.pos.z + 35);
  sun.target.position.copy(player.pos);

  // ----- UI更新 -----
  document.getElementById('hpfill').style.width = (player.hp / player.maxHp * 62) + '%';
  document.getElementById('mpfill').style.width = (player.mp / player.maxMp * 38) + '%';
  drawMinimap();
  drawCompass(t);

  // ダメージ数字
  for (let i = dmgNums.length - 1; i >= 0; i--) {
    const d = dmgNums[i];
    d.t += dt;
    d.pos.y += dt * 1.4;
    const sp = projectToScreen(d.pos);
    d.el.style.left = sp.x + 'px';
    d.el.style.top = sp.y + 'px';
    d.el.style.opacity = clamp(1.4 - d.t * 1.6, 0, 1);
    if (d.t > 0.95 || sp.behind) { d.el.remove(); dmgNums.splice(i, 1); }
  }
  updateBursts(dt);
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (started) update(dt, t);
  else {
    // タイトル画面ではゆっくり旋回
    camYaw += dt * 0.05;
    const r = 14;
    camera.position.set(player.pos.x + Math.sin(camYaw) * r, player.pos.y + 5, player.pos.z + Math.cos(camYaw) * r);
    camera.lookAt(player.pos.x, player.pos.y + 2, player.pos.z);
    waterUniforms.uTime.value = t;
    grassUniform.value = t;
    for (const isl of islands) isl.position.y = isl.userData.baseY + Math.sin(t * isl.userData.sp + isl.userData.ph) * 2.2;
  }
  renderer.render(scene, camera);
}
updateScore();
loop();
</script>
